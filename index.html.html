<style>
:root{--bg:#f2f2f7;--card:#fff;--sep:rgba(60,60,67,.18);--lb:#000;--sec:rgba(60,60,67,.6);--ter:rgba(60,60,67,.3);--acc:#007aff;--bar:rgba(242,242,247,.8);--track:#e5e5ea;--press:#d1d1d6;--top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--sep:rgba(84,84,88,.6);--lb:#fff;--sec:rgba(235,235,245,.6);--ter:rgba(235,235,245,.3);--acc:#0a84ff;--bar:rgba(0,0,0,.7);--track:#2c2c2e;--press:#2c2c2e}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--sep:rgba(84,84,88,.6);--lb:#fff;--sec:rgba(235,235,245,.6);--ter:rgba(235,235,245,.3);--acc:#0a84ff;--bar:rgba(0,0,0,.7);--track:#2c2c2e;--press:#2c2c2e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--lb);font:17px/1.25 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
@media (min-width:500px){html,body{background:#c7c7cc;display:flex;align-items:center;justify-content:center}
#app{width:390px;height:844px;max-height:96vh;border-radius:48px;border:10px solid #1b1b1d;--top:54px}
#app::after{content:"";position:absolute;top:11px;left:50%;width:110px;height:32px;margin-left:-55px;border-radius:20px;background:#000;z-index:50}}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--bg);transition:transform .35s cubic-bezier(.2,.8,.2,1);-webkit-overflow-scrolling:touch;box-shadow:-6px 0 24px rgba(0,0,0,.12)}
.page.in{transform:translateX(100%)}.page.under{transform:translateX(-28%)}
.nav{position:sticky;top:0;z-index:5;height:calc(44px + var(--top));padding-top:var(--top);display:flex;align-items:center;justify-content:space-between;padding-left:8px;padding-right:16px}
.nav::before{content:"";position:absolute;inset:0;background:var(--bar);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-bottom:.5px solid var(--sep);opacity:0;transition:opacity .2s}
.sc .nav::before{opacity:1}
.nav>*{position:relative}
.back{display:flex;align-items:center;gap:2px;border:0;background:none;color:var(--acc);font:inherit;padding:8px 6px;cursor:pointer;max-width:42%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t{position:absolute!important;left:50%;transform:translateX(-50%);font-weight:600;opacity:0;transition:opacity .2s;max-width:50%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .t{opacity:1}
h1{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.37px;margin:0 20px 10px}
.body{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.card{margin:0 16px 35px;background:var(--card);border-radius:20px;overflow:hidden}
.foot{margin:-26px 32px 30px;font-size:13px;line-height:18px;color:var(--sec)}
.row{display:flex;align-items:center;padding-left:16px;cursor:pointer;user-select:none;-webkit-user-select:none}
.row:active{background:var(--press)}
.in{flex:1;display:flex;align-items:center;min-height:44px;padding:0 16px 0 0;border-top:.5px solid var(--sep);min-width:0}
.row:first-child .in{border-top:0}
.ic{width:30px;height:30px;border-radius:8px;margin-right:14px;display:flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic svg .f{fill:#fff;stroke:none}
.lb{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vl{color:var(--sec);margin-left:10px;max-width:58%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{margin-left:8px;width:8px;height:13px;flex:none}
.chev path{fill:none;stroke:var(--ter);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.blue{color:var(--acc)}.mid{justify-content:center;text-align:center}
.search{margin:0 16px 20px;display:flex;align-items:center;gap:6px;background:rgba(118,118,128,.12);border-radius:12px;height:38px;padding:0 10px;color:var(--sec)}
.search input{flex:1;border:0;background:none;font:inherit;color:var(--lb);outline:0;min-width:0}
.search svg{width:16px;height:16px;fill:none;stroke:var(--sec);stroke-width:2.2;stroke-linecap:round}
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.sw span{position:absolute;inset:0;border-radius:16px;background:rgba(120,120,128,.32);transition:background .25s}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .25s}
.sw input:checked+span{background:#34c759}.sw input:checked+span::after{transform:translateX(20px)}
.acct{padding:12px 16px;display:flex;align-items:center;gap:14px}
.av{width:60px;height:60px;border-radius:50%;background:linear-gradient(#a2a2a8,#7c7c82);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;flex:none}
.acct b{display:block;font-size:20px;font-weight:500}.acct small{font-size:13px;color:var(--sec)}
.edit{padding:0 16px;display:flex;align-items:center;min-height:44px}
.edit input{width:100%;border:0;background:none;font:inherit;color:var(--lb);outline:0;padding:11px 0}
.chk{width:16px;height:16px;fill:none;stroke:var(--acc);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
